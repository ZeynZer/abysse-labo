<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abysse – Laboratoire d'évolution</title>
<style>
  :root { --bg:#0b0e15; --panel:#151923; --panel2:#1c2130; --line:#2a3043; --text:#e6e8ef; --muted:#8a90a6; --blue:#338ced; --orange:#e76624; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
  #app { display: grid; grid-template-columns: 290px 1fr 370px; grid-template-rows: 50px 1fr; height: 100vh; }
  #top { grid-column: 1 / 4; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  #top h1 span { color: var(--muted); font-weight: 400; font-size: 12px; }
  .grp { display: flex; align-items: center; gap: 3px; background: var(--bg); border-radius: 9px; padding: 3px; }
  .grp .t { color: var(--muted); font-size: 11px; padding: 0 6px; }
  button { font: inherit; padding: 6px 10px; border-radius: 7px; border: none; background: var(--panel2); color: var(--text); cursor: pointer; white-space: nowrap; }
  button:hover { background: #283048; }
  button.on { background: #2563b8; }
  button.primary { background: #2563b8; } button.primary:hover { background: #2d72d2; }
  button.danger:hover { background: #7a2e33; }
  .grp button { background: transparent; padding: 5px 8px; }
  .grp button:hover { background: var(--panel2); }
  .grp button.on { background: #2563b8; }
  .spacer { flex: 1; }
  #saveState { color: var(--muted); font-size: 11px; white-space: nowrap; }

  aside { background: var(--panel); overflow-y: auto; }
  #left { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #right { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .h { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .row { display: flex; gap: 6px; align-items: center; }
  .card { background: var(--panel2); border-radius: 11px; padding: 10px; border: 2px solid transparent; cursor: pointer; }
  .card.sel { border-color: #3d6fd0; }
  .card .top { display: flex; gap: 9px; align-items: center; }
  .card canvas { width: 72px; height: 44px; border-radius: 7px; background: #0c2540; flex: none; }
  .card .name { font-weight: 650; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.4; }
  .chipst { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; background: #233; }
  .chipst.run { background: #1d4d33; color: #9be3b8; } .chipst.ice { background: #23365a; color: #a9c8f5; }
  .card .bar { height: 3px; background: #2a3043; border-radius: 2px; margin: 8px 0 7px; overflow: hidden; }
  .card .bar div { height: 100%; background: var(--blue); }
  .card .btns { display: flex; gap: 4px; }
  .card .btns button { flex: 1; padding: 5px 0; font-size: 12px; background: #262c3e; }
  .card .btns button:hover { background: #313954; }

  #center { position: relative; overflow: hidden; background: #04101f; }
  #ocean { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #ocean.drag { cursor: grabbing; }
  #minimap { position: absolute; left: 12px; bottom: 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,.15); cursor: pointer; }
  #hud { position: absolute; left: 12px; top: 10px; background: rgba(4,14,28,.6); padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; pointer-events: none; }
  #zoomBtns { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  #zoomBtns button { width: 34px; height: 34px; padding: 0; font-size: 16px; background: rgba(21,25,35,.85); }
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(21,25,35,.95); border: 1px solid var(--line); padding: 9px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 70%; text-align: center; }
  #toast.show { opacity: 1; }
  #duelHud { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: none; gap: 10px; align-items: stretch; z-index: 5; }
  #duelHud.show { display: flex; }
  .dside { background: rgba(10,16,28,.88); border-radius: 12px; padding: 8px 14px; min-width: 190px; border: 2px solid; }
  .dside .n { font-weight: 700; font-size: 14px; } .dside .s { font-size: 12px; color: #c9cede; margin-top: 3px; line-height: 1.5; }
  .dmid { background: rgba(10,16,28,.88); border-radius: 12px; padding: 8px 14px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .dmid .clock { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #winner { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); background: rgba(10,16,28,.94); border: 1px solid var(--line); border-radius: 16px; padding: 22px 30px; text-align: center; display: none; z-index: 6; }
  #winner.show { display: block; } #winner h2 { font-size: 24px; margin-bottom: 8px; } #winner p { color: #c9cede; margin-bottom: 14px; line-height: 1.5; }
  .spec { background: var(--panel2); border-radius: 11px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .spec .top { display: flex; gap: 10px; align-items: center; } .spec canvas { width: 84px; height: 52px; background: #0c2540; border-radius: 7px; flex: none; }
  .spec input { width: 100%; font-weight: 650; }
  .spec .btns { display: flex; gap: 4px; flex-wrap: wrap; } .spec .btns button { flex: 1; font-size: 12px; padding: 5px 6px; }
  .duelcol { background: var(--bg); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #oceanMenu { position: absolute; top: 56px; right: 380px; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; z-index: 20; display: none; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #oceanMenu.show { display: block; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border-radius: 0; background: transparent; padding: 12px 0; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--blue); background: transparent; }
  .tabpage { padding: 14px; display: none; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1; }
  .tabpage.show { display: flex; }
  .placeholder { color: var(--muted); text-align: center; padding: 40px 10px; line-height: 1.6; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 7px 8px; }
  .stat .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 10px; color: var(--muted); }
  .canvasbox { position: relative; background: var(--bg); border-radius: 10px; overflow: hidden; }
  .canvasbox canvas { display: block; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: #c9cede; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .smalls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .smalls .t { font-size: 11px; color: #c9cede; margin-bottom: 3px; }
  .fossils { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .fossil { flex: none; background: var(--bg); border-radius: 8px; padding: 4px; cursor: pointer; text-align: center; font-size: 10px; color: var(--muted); border: 1px solid transparent; }
  .fossil:hover { border-color: #3d6fd0; }
  .fossil canvas { display: block; width: 84px; height: 52px; }
  .log { font-size: 12px; color: #a6abbf; line-height: 1.6; max-height: 170px; overflow-y: auto; }
  select, input[type=text], input[type=number] { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  input[type=range] { width: 100%; accent-color: #338ced; }
  .genes { display: flex; flex-direction: column; gap: 5px; }
  .gene { display: grid; grid-template-columns: 130px 1fr 46px; gap: 8px; align-items: center; font-size: 12px; }
  .gene .gb { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .gene .gb div { height: 100%; background: var(--blue); border-radius: 3px; }
  .gene .gv { text-align: right; font-variant-numeric: tabular-nums; color: #c9cede; }
  .energy { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .energy div { height: 100%; background: #0aac23; }
  .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); }

  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 50; align-items: center; justify-content: center; }
  #modal.show { display: flex; }
  .mbox { width: min(1100px, 96vw); height: min(820px, 94vh); background: var(--panel); border-radius: 16px; display: grid; grid-template-columns: 1fr 380px; overflow: hidden; border: 1px solid var(--line); }
  .mform { overflow-y: auto; padding: 20px 22px; }
  .mform h2 { font-size: 18px; margin-bottom: 4px; }
  .mform .intro { color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .sec { margin-top: 18px; }
  .sec > .h { margin-bottom: 10px; }
  .field { display: grid; grid-template-columns: 220px 1fr 80px; gap: 10px; align-items: center; margin-bottom: 9px; }
  .field label { color: #c9cede; font-size: 12px; line-height: 1.3; }
  .field .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: #c9cede; }
  .field .two { display: flex; gap: 8px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .checks label { display: flex; gap: 7px; align-items: center; font-size: 12px; color: #c9cede; cursor: pointer; }
  .mside { background: var(--bg); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .mside canvas { border-radius: 12px; display: block; }
  .mfoot { display: flex; gap: 8px; margin-top: auto; }
  .mfoot button { flex: 1; padding: 10px; }
  #tip { position: fixed; pointer-events: none; background: #0b0e15; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 12px; line-height: 1.45; display: none; z-index: 100; white-space: nowrap; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #2a3043; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>🌊 Abysse <span>laboratoire d'évolution</span></h1>
    <div class="grp" id="timeGrp"><span class="t">Temps</span></div>
    <div class="grp" id="ovGrp"><span class="t">Voir</span></div>
    <button id="oceanBtn">⚙ Océan</button>
    <button id="arenaBtn" class="primary">⚔ Arène</button>
    <div class="spacer"></div>
    <span id="saveState">–</span>
    <button id="saveBtn" title="Sauvegarder maintenant">💾</button>
  </div>

  <aside id="left">
    <div class="row" style="justify-content:space-between"><div class="h">🧪 Laboratoire</div><span id="labSpeed" class="h"></span></div>
    <div class="row">
      <button class="primary" id="newSpecies" style="flex:1">+ Nouvelle espèce</button>
      <button id="importBtn" title="Importer une espèce (.json)">⬆ Importer</button>
    </div>
    <div id="speciesList" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="h" style="margin-top:6px;line-height:1.6;text-transform:none;letter-spacing:0">
      🧬 évoluer / ❄ stocker · 🌊 lâcher 12 champions dans l'océan (là où tu regardes) · ✏ contraintes · ⧉ dupliquer · ⬇ exporter
    </div>
  </aside>

  <main id="center">
    <canvas id="ocean"></canvas>
    <canvas id="minimap" width="220" height="138"></canvas>
    <div id="hud"></div>
    <div id="zoomBtns"><button id="zin">+</button><button id="zout">−</button><button id="zfit" title="Vue d'ensemble">⤢</button></div>
    <div id="toast"></div>
    <div id="duelHud"></div>
    <div id="winner"></div>
  </main>

  <aside id="right">
    <div class="tabs"><button data-tab="sp" class="on">🧬 Espèce</button><button data-tab="ind">🔬 Individu</button><button data-tab="spec">⭐ Spécimens</button></div>
    <div class="tabpage show" id="tab-sp"></div>
    <div class="tabpage" id="tab-ind"></div>
    <div class="tabpage" id="tab-spec"></div>
  </aside>
</div>

<div id="oceanMenu"></div>
<div id="modal"></div>
<div id="tip"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script id="core">
// =====================================================================
//  NOYAU PARTAGÉ (thread principal + worker du labo)
// =====================================================================
const NIN = 13;
const SENSOR_DEFS = [
  { k: 'rhythm', name: 'Rythme interne (oscillateur, comme la moelle épinière)', idx: [0, 1] },
  { k: 'target', name: 'Direction de la cible (vision)', idx: [2, 3] },
  { k: 'dist', name: 'Distance de la cible', idx: [4] },
  { k: 'speed', name: 'Vitesse propre (ligne latérale)', idx: [5] },
  { k: 'spin', name: 'Équilibre (rotation)', idx: [6] },
  { k: 'energy', name: 'Faim (niveau d\'énergie)', idx: [7] },
  { k: 'proprio', name: 'Proprioception (sens de la forme du corps)', idx: [8, 9] },
  { k: 'danger', name: 'Détection des prédateurs (peur)', idx: [10, 11] },
];
const INPUT_LABELS = ['Rythme sin', 'Rythme cos', 'Cible devant', 'Cible côté', 'Distance', 'Vitesse', 'Rotation', 'Énergie', 'Courbure tête', 'Courbure queue', 'Danger devant', 'Danger côté', 'Biais'];
const GOALS = {
  hunt: '🦐 Chasser les crevettes',
  speed: '⚡ Nager le plus vite possible',
  left: '⬅ Nager vers la gauche',
  right: '➡ Nager vers la droite',
  up: '⬆ Monter vers la surface',
  down: '⬇ Plonger vers le fond',
  spin: '🌀 Tourner sur soi-même',
  predator: '🦈 Attraper une proie qui fuit',
  survive: '🐡 Manger sans se faire manger',
};
const DIETS = { herbivore: '🦐 Mange des crevettes', carnivore: '🦈 Prédateur (mange les autres espèces)', omnivore: '🍽 Omnivore (crevettes + autres espèces)' };
const GOAL_DIRS = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
const ACT_NAMES = { tanh: 'Tangente hyperbolique (douce)', relu: 'ReLU (seuil, comme un neurone qui « tire »)', sin: 'Sinus (neurones oscillants)', sigmoid: 'Sigmoïde (centrée)' };
const CN = 0.35, CT = 0.025;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const arr = (n, f) => Array.from({ length: n }, f);
const newId = () => Math.floor(Math.random() * 2147483647);

function defaultCfg() {
  return {
    name: 'Nageur primitif', hue: 185, pattern: 'stripes', diet: 'herbivore',
    body: { segMin: 2, segMax: 16, segStart: 3, lenMin: 6, lenMax: 14, widthMin: 6, widthMax: 16, taperMin: 0.7, taperMax: 1, finMax: 3, pectMax: 2, strMax: 0.25, flexMax: 0.9, freqMax: 0.2 },
    brain: { layers: [12], act: 'tanh', recurrent: false, neurogenesis: true,
      sensors: { rhythm: true, target: true, dist: true, speed: false, spin: false, energy: false, proprio: false, danger: false } },
    evo: { pop: 200, mutRate: 0.08, mutPower: 0.4, elite: 0.05, crossover: true, trials: 2, vertMut: 0.05 },
    goal: { type: 'hunt', energyCost: 1, dur: 500 },
    env: { viscosity: 1 },
  };
}

// ---------------- Cerveau ----------------
function brainSizes(cfg) { return [NIN, ...cfg.brain.layers, cfg.body.segMax - 1]; }
function makeBrain(cfg) {
  const s = brainSizes(cfg), W = [];
  for (let l = 0; l < s.length - 1; l++) W.push(arr((s[l] + 1) * s[l + 1], () => gauss() * 2.2 / Math.sqrt(s[l] + 1)));
  const R = cfg.brain.recurrent ? arr(s[1] * s[1], () => gauss() * 0.25) : null;
  const active = cfg.brain.layers.map(h => cfg.brain.neurogenesis ? Math.max(2, Math.ceil(h / 2)) : h);
  return { W, R, active, sizes: s };
}
function copyW(src, sIn, sOut, dst, dIn, dOut) {
  for (let o = 0; o < Math.min(sOut, dOut); o++) {
    for (let i = 0; i < Math.min(sIn, dIn); i++) dst[o * (dIn + 1) + i] = src[o * (sIn + 1) + i];
    dst[o * (dIn + 1) + dIn] = src[o * (sIn + 1) + sIn];
  }
}
function fitBrain(b, cfg) {
  const s = brainSizes(cfg), L = cfg.brain.layers;
  const same = b && b.sizes.length === s.length && b.sizes.every((v, i) => v === s[i]) && (!!b.R === !!cfg.brain.recurrent);
  if (!same) {
    const nb = makeBrain(cfg);
    if (b) {
      const oh = b.W.length - 1, nh = nb.W.length - 1;
      if (b.sizes[0] !== s[0] && oh > 0) { // anciennes versions : nouvelles entrées insérées avant le biais
        const sIn = b.sizes[0], dIn = s[0], src = b.W[0], dst = nb.W[0];
        for (let o = 0; o < Math.min(b.sizes[1], s[1]); o++) {
          for (let i = 0; i < Math.min(sIn - 1, dIn - 1); i++) dst[o * (dIn + 1) + i] = src[o * (sIn + 1) + i];
          for (let i = sIn - 1; i < dIn - 1; i++) dst[o * (dIn + 1) + i] = 0;
          dst[o * (dIn + 1) + dIn - 1] = src[o * (sIn + 1) + sIn - 1]; dst[o * (dIn + 1) + dIn] = src[o * (sIn + 1) + sIn];
        }
      } else if (oh > 0) copyW(b.W[0], b.sizes[0], b.sizes[1], nb.W[0], s[0], s[1]);
      for (let l = 1; l < Math.min(oh, nh); l++) copyW(b.W[l], b.sizes[l], b.sizes[l + 1], nb.W[l], s[l], s[l + 1]);
      copyW(b.W[oh], b.sizes[oh], b.sizes[oh + 1], nb.W[nh], s[nh], s[nh + 1]);
      if (b.R && nb.R) { const oH = b.sizes[1], nH = s[1]; for (let o = 0; o < Math.min(oH, nH); o++) for (let r = 0; r < Math.min(oH, nH); r++) nb.R[o * nH + r] = b.R[o * oH + r]; }
      for (let l = 0; l < Math.min(b.active.length, nb.active.length); l++) nb.active[l] = b.active[l];
    }
    b = nb;
  }
  b.active = L.map((h, l) => cfg.brain.neurogenesis ? clamp(b.active[l] || 2, 1, h) : h);
  return b;
}
function synapseCount(cfg) {
  const s = brainSizes(cfg); let n = 0;
  for (let l = 0; l < s.length - 1; l++) n += (s[l] + 1) * s[l + 1];
  if (cfg.brain.recurrent) n += s[1] * s[1];
  return n;
}

// ---------------- Génome ----------------
const MORPH = [['segLen', 'lenMin', 'lenMax'], ['headW', 'widthMin', 'widthMax'], ['taper', 'taperMin', 'taperMax'], ['fin', null, 'finMax'], ['pect', null, 'pectMax'], ['flex', null, 'flexMax'], ['str', null, 'strMax'], ['freq', null, 'freqMax']];
function randGenome(cfg) {
  const b = cfg.body;
  return clampGenome({
    id: newId(), nSeg: b.segStart, segLen: rnd(b.lenMin, b.lenMax), headW: rnd(b.widthMin, b.widthMax), taper: rnd(b.taperMin, b.taperMax),
    fin: rnd(0, b.finMax * 0.5), pect: rnd(0, b.pectMax * 0.3), flex: rnd(0.3, 1) * b.flexMax, str: rnd(0.4, 1) * b.strMax,
    freq: rnd(0.3, 1) * b.freqMax, hue: cfg.hue + rnd(-12, 12), brain: makeBrain(cfg),
  }, cfg);
}
function clampGenome(g, cfg) {
  const b = cfg.body;
  g.nSeg = clamp(Math.round(g.nSeg), b.segMin, b.segMax);
  g.segLen = clamp(g.segLen, b.lenMin, b.lenMax);
  g.headW = clamp(g.headW, b.widthMin, b.widthMax);
  g.taper = clamp(g.taper, b.taperMin, b.taperMax);
  g.fin = clamp(g.fin, 0, b.finMax); g.pect = clamp(g.pect, 0, b.pectMax);
  g.flex = clamp(g.flex, 0.05, b.flexMax); g.str = clamp(g.str, 0.02, b.strMax); g.freq = clamp(g.freq, 0.01, b.freqMax);
  g.brain = fitBrain(g.brain, cfg);
  return g;
}
function cloneG(g) {
  return { ...g, id: newId(), brain: { W: g.brain.W.map(w => w.slice()), R: g.brain.R ? g.brain.R.slice() : null, active: g.brain.active.slice(), sizes: g.brain.sizes.slice() } };
}
function crossoverG(a, b) {
  const c = cloneG(a);
  for (const [k] of MORPH) if (Math.random() < 0.5) c[k] = b[k];
  if (Math.random() < 0.5) c.nSeg = b.nSeg;
  if (a.brain.sizes.join() === b.brain.sizes.join()) {
    // on échange des neurones entiers (avec toutes leurs connexions) : plus réaliste et plus efficace
    c.brain.W.forEach((w, l) => {
      const inN = c.brain.sizes[l] + 1, outN = c.brain.sizes[l + 1];

// ---------------- Corps & physique ----------------

// ---------------- Tests du labo ----------------
function makeScenarios(cfg) {
  return arr(cfg.evo.trials, () => ({ th: rnd(0, 2 * Math.PI), offs: arr(10, () => { const a = rnd(0, 2 * Math.PI), d = rnd(150, 250); return [Math.cos(a) * d, Math.sin(a) * d]; }) }));

function goalTarget(goal, sim, tx, ty) {

// Un essai : la copie nage seule face à son objectif (cible fixe, proie qui fuit ou prédateur qui la traque)

// ---------------- Moteur d'évolution (tourne dans le worker) ----------------
class LabEngine {
  constructor(emit) { this.emit = emit; this.sp = new Map(); this.rr = 0; this.lastProg = 0; }
  handle(msg) {

        const cfg = msg.cfg, seeds = (msg.seeds || []).map(g => clampGenome(g, cfg));
        const ns = { id: msg.id, cfg, gen: msg.gen || 0, evals: msg.evals || 0, running: msg.running !== false, pop: [], lastSorted: null };
        for (let i = 0; i < cfg.evo.pop; i++) ns.pop.push(seeds.length ? (i < seeds.length ? seeds[i] : mutateG(cloneG(seeds[i % seeds.length]), cfg)) : randGenome(cfg));

      case 'remove': this.sp.delete(msg.id); break;
      case 'top': this.emit({ t: 'reply', req: msg.req, data: s ? (s.lastSorted || s.pop).slice(0, msg.n) : [] }); break;
      case 'snapshot': this.emit({ t: 'reply', req: msg.req, data: [...this.sp.values()].map(x => ({ id: x.id, gen: x.gen, evals: x.evals, seeds: (x.lastSorted || x.pop).slice(0, 60) })) }); break;

    const t0 = performance.now();
    while (performance.now() - t0 < budget) {
      const s = list[this.rr++ % list.length];
      for (let k = 0; k < 3; k++) this.evalOne(s);
    }
    if (t0 - this.lastProg > 200) { this.lastProg = t0; this.emit({ t: 'progress', items: list.map(s => ({ id: s.id, idx: s.idx, size: s.pop.length })) }); }
    return true;
  }
  evalOne(s) {
    const g = s.pop[s.idx]; let sum = 0;
    for (const sc of s.scen) sum += evaluate(g, s.cfg, sc);
    s.scores[s.idx] = sum / s.scen.length; s.idx++; s.evals++;

      div: 100 * (std(g => g.nSeg, b.segMax - b.segMin + 1) + std(g => g.segLen, b.lenMax - b.lenMin + 1) + std(g => g.str, b.strMax) + std(g => g.flex, b.flexMax) + std(g => g.freq, b.freqMax) + std(g => g.brain.W[0][0] + g.brain.W[0][5], 3)) / 6,
    };

<script>
// =====================================================================
//  ÉTAT GLOBAL
// =====================================================================
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('fr-FR');
const OW = 9000, OH = 5200;              // taille de l'océan
const POS = '#e76624', NEG = '#338ced';  // couleurs divergentes (activation +/-)

const App = {
  species: [],
  timeScale: 1,
  ov: { trails: false, forces: false, muscles: false, vision: false, xray: false, labels: true },
  selSp: null, selCr: null, follow: false,
};

// =====================================================================
//  WORKER DU LABO (l'évolution tourne en parallèle, sans ralentir l'océan)
// =====================================================================
let worker = null, fallback = null, reqId = 1;
const pending = new Map();
function send(msg) { if (worker) worker.postMessage(msg); else fallback.handle(structuredClone(msg)); }
function request(msg) {
  return new Promise(res => {
    const req = reqId++; pending.set(req, res);
    send({ ...msg, req });
    setTimeout(() => { if (pending.has(req)) { pending.delete(req); res(null); } }, 4000);
  });
}
function onEngine(m) {
  if (m.t === 'reply') { const r = pending.get(m.req); if (r) { pending.delete(m.req); r(m.data); } return; }
  if (m.t === 'progress') { for (const it of m.items) { const sp = spById(it.id); if (sp) sp.progress = it.idx / it.size; } return; }
  if (m.t === 'gen') onGeneration(m);
}
(function startWorker() {
  try {
    const src = $('core').textContent + `
      const E = new LabEngine(m => postMessage(m));
      onmessage = e => E.handle(e.data);
      (function loop() { const busy = E.tick(30); setTimeout(loop, busy ? 0 : 50); })();`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => onEngine(e.data);
    worker.onerror = () => { worker = null; fallback = new LabEngine(onEngine); App.species.forEach(resendSpecies); };
  } catch (e) { worker = null; fallback = new LabEngine(onEngine); }
})();

// =====================================================================
//  ESPÈCES
// =====================================================================
const spById = id => App.species.find(s => s.id === id);
const GENERA = ['Anguilla', 'Piscis', 'Draco', 'Abyssus', 'Nereis', 'Vermis', 'Lampra', 'Myxo', 'Squalus', 'Gyrinus', 'Cephalo', 'Thalasso'];
const EPITHETS = ['velox', 'primordia', 'luminosa', 'profunda', 'audax', 'serpentina', 'minima', 'gigantea', 'curiosa', 'rapax', 'tenebris', 'aurora'];
const randomName = () => GENERA[Math.floor(Math.random() * GENERA.length)] + ' ' + EPITHETS[Math.floor(Math.random() * EPITHETS.length)];

function createSpecies(cfg, opts = {}) {
  const sp = {
    id: opts.id || newId(), cfg, gen: opts.gen || 0, evals: opts.evals || 0, running: opts.running !== false,
    history: opts.history || [], champs: (opts.champs || []).map(e => ({ ...e, g: clampGenome(e.g, cfg) })), log: opts.log || [], progress: 0,
    champ: null, record: opts.record || 0,

  }
  c2.restore();
}

  g.addColorStop(0, '#2b8fc2'); g.addColorStop(0.25, '#145583'); g.addColorStop(0.55, '#0a2e55'); g.addColorStop(1, '#030b1b');

    ctx.beginPath(); ctx.moveTo(x - 30, Math.max(0, sy(0))); ctx.lineTo(x + 30, Math.max(0, sy(0))); ctx.lineTo(x + 160, CH); ctx.lineTo(x + 40, CH); ctx.fill();

function poseThumb(canvas, g, cfg, label) {
  const c2 = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  c2.setTransform(1, 0, 0, 1, 0, 0); c2.clearRect(0, 0, W, H);
  if (!g) return;
  const sim = new Sim(g, cfg, 0, 0, 0);
  for (let j = 1; j < sim.n; j++) sim.a[j] = g.flex * 0.45 * Math.sin(j * 0.9);
  sim.local(sim.qx, sim.qy, sim.dir);
  const { P } = bodyGeom(sim);
  let mx = 1e9, Mx = -1e9, my = 1e9, My = -1e9; for (const p of P) { mx = Math.min(mx, p[0]); Mx = Math.max(Mx, p[0]); my = Math.min(my, p[1]); My = Math.max(My, p[1]); }
  const pad = g.headW + g.fin * 7 + 6, k = Math.min((W - 8) / (Mx - mx + pad * 2), (H - 8) / (My - my + pad * 2), 2.2);
  c2.setTransform(k, 0, 0, k, W / 2 - (mx + Mx) / 2 * k, H / 2 - (my + My) / 2 * k);
  drawCreature(c2, sim, { pattern: cfg.pattern });
  c2.setTransform(1, 0, 0, 1, 0, 0);
}

async function speciesAction(sp, a) {
  if (a === 'run') { sp.running = !sp.running; send({ t: 'run', id: sp.id, on: sp.running }); addLog(sp, sp.running ? '🧬 Sortie du congélateur, l\'évolution reprend' : '❄ Espèce stockée'); spTabFor = null; dirty.sp = true; renderSpeciesList(); }
  if (a === 'rel') {
    const top = await request({ t: 'top', id: sp.id, n: 12 });
    if (!top || !top.length) return toast('Pas encore de génération terminée pour cette espèce.');
    if (App.view === 'arena') showOcean();

    top.forEach(g => spawnCreature(g, sp, clamp(cx + rnd(-380, 380), 40, App.ocean.W - 40), clamp(cy + rnd(-220, 220), 40, floorY(cx) - 40), { labGen: sp.gen, grace: 700 }, App.ocean)); // le temps de se disperser
    burst(cx, cy, '160,230,255', 30, 3);
    toast(`🌊 12 champions de <b>${esc(sp.cfg.name)}</b> (gén ${sp.gen}) lâchés dans l'océan`);

  }

    const cfg = structuredClone(sp.cfg); cfg.name = sp.cfg.name + ' II'; cfg.hue = (cfg.hue + 40) % 360;
    (seeds || []).forEach(g => g.hue = (g.hue + 40) % 360);
    const ns = createSpecies(cfg, { seeds: seeds || [], gen: sp.gen, history: sp.history.slice(), champs: sp.champs.slice(), log: [] });
    addLog(ns, `⧉ Nouvelle lignée séparée de ${esc(sp.cfg.name)}`);
    toast('Lignée dupliquée : les deux vont maintenant évoluer séparément.');
  }
  if (a === 'exp') {
    const seeds = await request({ t: 'top', id: sp.id, n: 100 });
    const data = { abysse: 1, cfg: sp.cfg, gen: sp.gen, evals: sp.evals, history: sp.history, champs: sp.champs.slice(-60), log: sp.log, seeds: seeds || [] };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    const aEl = document.createElement('a'); aEl.href = url; aEl.download = sp.cfg.name.replace(/\s+/g, '_') + '.abysse.json'; aEl.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  if (a === 'del') {
    if (!confirm(`Supprimer définitivement l'espèce « ${sp.cfg.name} » et toutes ses créatures ?`)) return;
    send({ t: 'remove', id: sp.id });
    App.species = App.species.filter(s => s !== sp);

    if (App.selSp === sp) App.selSp = App.species[0] || null;
    if (App.selCr && App.selCr.sp === sp) App.selCr = null;
    dirty.sp = dirty.ind = true; renderSpeciesList();
  }
}

const charts = [];
function makeChart(canvas, W, H, series, getRows, fmtV) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ch = { canvas, W, H, series, getRows, fmtV: fmtV || (v => fmt(v)), hover: -1, dpr };
  canvas.addEventListener('mousemove', e => {
    const rows = ch.getRows(); if (!rows.length) return;
    const r = canvas.getBoundingClientRect(), pl = 32, pr = 6;
    ch.hover = clamp(Math.round((e.clientX - r.left - pl) / (W - pl - pr) * (rows.length - 1)), 0, rows.length - 1);
    const row = rows[ch.hover];
    const tip = $('tip'); tip.style.display = 'block';
    tip.innerHTML = `<b>Génération ${row.gen}</b><br>` + series.map(s => `<i style="display:inline-block;width:10px;height:3px;background:${s.color};vertical-align:middle;margin-right:4px"></i>${s.label} : ${ch.fmtV(row[s.key])}`).join('<br>');
    tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 14) + 'px'; tip.style.top = (e.clientY - 10) + 'px';
    drawChart(ch);
  });
  canvas.addEventListener('mouseleave', () => { ch.hover = -1; $('tip').style.display = 'none'; drawChart(ch); });
  charts.push(ch);
  return ch;
}
function drawChart(ch) {
  const c2 = ch.canvas.getContext('2d'), { W, H } = ch, rows = ch.getRows(), P = { l: 32, r: 6, t: 6, b: 15 };
  c2.setTransform(ch.dpr, 0, 0, ch.dpr, 0, 0); c2.clearRect(0, 0, W, H);
  let maxY = 0; for (const r of rows) for (const s of ch.series) maxY = Math.max(maxY, r[s.key]); maxY = maxY * 1.1 || 1;
  const X = i => P.l + (rows.length < 2 ? 0 : i / (rows.length - 1)) * (W - P.l - P.r), Y = v => H - P.b - v / maxY * (H - P.t - P.b);
  c2.font = '9.5px system-ui'; c2.fillStyle = '#8a90a6'; c2.textAlign = 'right'; c2.textBaseline = 'middle';
  for (let k = 0; k <= 2; k++) { const v = maxY * k / 2, y = Y(v); c2.strokeStyle = 'rgba(255,255,255,.07)'; c2.lineWidth = 1; c2.beginPath(); c2.moveTo(P.l, y); c2.lineTo(W - P.r, y); c2.stroke(); c2.fillText(ch.fmtV(v), P.l - 4, y); }
  if (!rows.length) { c2.textAlign = 'center'; c2.fillText('En attente…', W / 2, H / 2); return; }
  c2.textBaseline = 'alphabetic'; c2.textAlign = 'left'; c2.fillText('gén ' + rows[0].gen, P.l, H - 3); c2.textAlign = 'right'; c2.fillText('gén ' + rows[rows.length - 1].gen, W - P.r, H - 3);
  for (const s of ch.series) { c2.strokeStyle = s.color; c2.lineWidth = 2; c2.lineJoin = 'round'; c2.beginPath(); rows.forEach((r, i) => i ? c2.lineTo(X(i), Y(r[s.key])) : c2.moveTo(X(i), Y(r[s.key]))); c2.stroke(); }
  if (ch.hover >= 0 && ch.hover < rows.length) {
    const x = X(ch.hover); c2.strokeStyle = 'rgba(255,255,255,.35)'; c2.lineWidth = 1; c2.beginPath(); c2.moveTo(x, P.t); c2.lineTo(x, H - P.b); c2.stroke();
    for (const s of ch.series) { c2.fillStyle = s.color; c2.strokeStyle = '#0b0e15'; c2.lineWidth = 2; c2.beginPath(); c2.arc(x, Y(rows[ch.hover][s.key]), 4, 0, 7); c2.fill(); c2.stroke(); }
  }
}

// ---------- bassin d'essai (course ancêtre vs champion) ----------
const Tank = { canvas: null, runners: [], cam: { x: 0, y: 0 }, idx: -1, race: true, followLatest: true, pendingReset: true, sp: null, endT: 0 };
function tankReset() {
  Tank.pendingReset = false; const sp = App.selSp; Tank.sp = sp; Tank.runners = []; Tank.endT = 0;
  if (!sp || !sp.champs || !sp.champs.length) return;
  if (Tank.followLatest || Tank.idx >= sp.champs.length) Tank.idx = sp.champs.length - 1;
  const entry = sp.champs[Tank.idx], anc = sp.champs[0], sc = makeScenarios({ evo: { trials: 1 } })[0];
  const mk = (e, main) => { const tr = new Trial(e.g, sp.cfg, sc); tr.gen = e.gen; tr.main = main; tr.trail = []; tr.g = e.g; return tr; };
  Tank.runners.push(mk(entry, true));
  if (Tank.race && anc !== entry) Tank.runners.push(mk(anc, false));
  Tank.cam.x = 0; Tank.cam.y = 0;
  const sl = $('tankSlider'); if (sl) { sl.max = sp.champs.length - 1; sl.value = Tank.idx; $('tankGenLbl').textContent = `Champion de la génération ${entry.gen}` + (Tank.followLatest ? ' (dernière)' : ''); }
}
function tankStep(dt) {
  if (!Tank.sp || !Tank.runners.length) return;
  for (const r of Tank.runners) { r.step(dt); if (!r.done && (r.sim.t | 0) % 4 === 0) { r.trail.push(r.sim.x, r.sim.y); if (r.trail.length > 300) r.trail.splice(0, 2); } }
  if (Tank.runners.every(r => r.done)) { Tank.endT += dt; if (Tank.endT > 90) tankReset(); }
}
function drawDummy(c2, x, y, kind, t, alpha) {
  c2.save(); c2.globalAlpha = alpha; c2.translate(x, y);
  if (kind === 'prey') { c2.fillStyle = '#c9d6e8'; c2.beginPath(); c2.ellipse(0, 0, 9, 5, Math.sin(t / 150) * 0.3, 0, 7); c2.fill(); c2.beginPath(); c2.moveTo(-8, 0); c2.lineTo(-14, -5); c2.lineTo(-14, 5); c2.fill(); }
  else { c2.fillStyle = 'rgba(220,50,50,.85)'; c2.beginPath(); c2.arc(0, 0, 13, 0, 7); c2.fill(); c2.font = '15px serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle'; c2.fillText('🦈', 0, 1); }
  c2.restore();
}
function renderTank(t) {
  const c = Tank.canvas; if (!c) return;
  const c2 = c.getContext('2d'), dpr = window.devicePixelRatio || 1, W = c.width / dpr, H = c.height / dpr;
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c2.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0f4470'); g.addColorStop(1, '#06203d'); c2.fillStyle = g; c2.fillRect(0, 0, W, H);
  const sp = Tank.sp;
  if (!sp || !Tank.runners.length) { c2.fillStyle = '#8a90a6'; c2.font = '12px system-ui'; c2.textAlign = 'center'; c2.fillText('En attente de la première génération…', W / 2, H / 2); return; }
  const main = Tank.runners[0], z = 0.85;
  Tank.cam.x += (main.sim.x - Tank.cam.x) * 0.08; Tank.cam.y += (main.sim.y - Tank.cam.y) * 0.08;
  c2.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - Tank.cam.x * z), dpr * (H / 2 - Tank.cam.y * z));
  const x0 = Tank.cam.x - W / 2 / z, x1 = Tank.cam.x + W / 2 / z, y0 = Tank.cam.y - H / 2 / z, y1 = Tank.cam.y + H / 2 / z;
  c2.strokeStyle = 'rgba(255,255,255,.06)'; c2.lineWidth = 1;
  for (let x = Math.floor(x0 / 50) * 50; x < x1; x += 50) { c2.beginPath(); c2.moveTo(x, y0); c2.lineTo(x, y1); c2.stroke(); }
  for (let y = Math.floor(y0 / 50) * 50; y < y1; y += 50) { c2.beginPath(); c2.moveTo(x0, y); c2.lineTo(x1, y); c2.stroke(); }
  c2.strokeStyle = 'rgba(255,255,255,.3)'; c2.beginPath(); c2.arc(0, 0, 8, 0, 7); c2.stroke();
  for (let i = Tank.runners.length - 1; i >= 0; i--) {
    const r = Tank.runners[i], a = r.main ? 1 : 0.4, goal = r.goal;
    if (r.trail.length > 3) { c2.strokeStyle = r.main ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.12)'; c2.lineWidth = 1.5; c2.beginPath(); c2.moveTo(r.trail[0], r.trail[1]); for (let k = 2; k < r.trail.length; k += 2) c2.lineTo(r.trail[k], r.trail[k + 1]); c2.stroke(); }
    if (goal === 'hunt' || goal === 'survive') { c2.globalAlpha = a; drawShrimp(c2, { x: r.tx, y: r.ty, ph: i }, 1, t); c2.globalAlpha = 1; }
    if (goal === 'predator') drawDummy(c2, r.tx, r.ty, 'prey', t, a);
    if (goal === 'survive') drawDummy(c2, r.ex, r.ey, 'pred', t, a);
    drawCreature(c2, r.sim, { alpha: r.caught ? a * 0.35 : a, glow: r.main, muscles: App.ov.muscles, forces: App.ov.forces, xray: App.ov.xray, pattern: sp.cfg.pattern, diet: sp.cfg.diet });
  }
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.font = '11px system-ui'; c2.textAlign = 'left';
  Tank.runners.forEach((r, i) => { c2.fillStyle = 'rgba(0,0,0,.45)'; c2.fillRect(6, 6 + i * 20, 240, 17); c2.fillStyle = r.main ? '#fff' : '#9aa3b8';
    c2.fillText(`${r.main ? '●' : '○'} Gén ${r.gen}${r.main ? '' : ' (ancêtre)'} : ${r.label()}`, 11, 18 + i * 20); });
  c2.fillStyle = 'rgba(255,255,255,.5)'; c2.textAlign = 'right'; c2.fillText(`t = ${main.t | 0} / ${sp.cfg.goal.dur}`, W - 8, H - 8);
}

async function sideGenomes(key, n) {

  }

}
async function startDuel(cfg) {

function duelStats(w) {
  return [0, 1].map(si => { const cs = w.creatures.filter(c => c.side === si && c.alive);
    return { alive: cs.length, eaten: w.eatenBy[si] + cs.reduce((a, c) => a + c.eaten, 0), kills: w.killsDead[si] + cs.reduce((a, c) => a + c.kills, 0), best: cs.reduce((a, c) => Math.max(a, c.sim.x), 0) }; });
}
function duelStep(w, dt) {
  const D = w.duel; if (D.over) return;
  D.t += dt;
  const st = duelStats(w);
  if (D.mode === 'sprint') {
    for (const c of w.creatures) if (c.sim.x >= w.W - 150 && !D.over) return endDuel(w, c.side, `${c.name || c.sp.cfg.name} franchit la ligne en premier en ${(D.t / 60).toFixed(1)} s !`);
  }
  if (D.mode === 'fight' && (st[0].alive === 0 || st[1].alive === 0)) {
    if (st[0].alive === st[1].alive) return endDuel(w, null, 'Les deux camps ont été anéantis.');
    const win = st[0].alive ? 0 : 1; return endDuel(w, win, `Il reste ${st[win].alive} survivant(s) · ${st[win].kills} victime(s) dévorée(s).`);
  }
  if (D.t >= D.T) {
    if (D.mode === 'food') { const [a, b] = [st[0].eaten, st[1].eaten]; return endDuel(w, a === b ? null : a > b ? 0 : 1, `Score final : ${a} 🦐 contre ${b} 🦐.`); }
    if (D.mode === 'sprint') { const [a, b] = [st[0].best, st[1].best]; return endDuel(w, Math.abs(a - b) < 5 ? null : a > b ? 0 : 1, 'Temps écoulé : victoire au plus avancé.'); }
    const ka = st[0].alive * 1000 + st[0].kills, kb = st[1].alive * 1000 + st[1].kills;
    return endDuel(w, ka === kb ? null : ka > kb ? 0 : 1, `Temps écoulé : ${st[0].alive} contre ${st[1].alive} survivants.`);
  }
}

}

    { t: 'range', p: 'goal.dur', l: 'Durée d\'un test', min: 200, max: 1500, step: 50 },
    { t: 'range', p: 'env.viscosity', l: 'Viscosité de l\'eau du labo (1 = océan)', min: 0.3, max: 2, step: 0.1 },
  ]],
];
let ed = null;
function openEditor(sp) {
  const cfg = sp ? structuredClone(sp.cfg) : Object.assign(defaultCfg(), { name: randomName(), hue: Math.floor(rnd(0, 360)) });
  ed = { sp, cfg, prevT: 0 };
  $('modal').innerHTML = `<div class="mbox"><div class="mform" id="edForm"></div>
    <div class="mside">
      <div class="h">Aperçu (corps moyen, nage simulée)</div>
      <canvas id="edPrev"></canvas>
      <div id="edInfo" style="font-size:12px;line-height:1.7;color:#c9cede"></div>
      <div style="font-size:11px;color:var(--muted);line-height:1.6">Les contraintes sont des <b>limites</b> : l'évolution choisit librement à l'intérieur. Plus tu laisses de liberté, plus les solutions peuvent être surprenantes.</div>
      <div class="mfoot"><button id="edCancel">Annuler</button><button class="primary" id="edOk">${sp ? 'Appliquer' : '🧬 Créer l\'espèce'}</button></div>
    </div></div>`;
  const dpr = window.devicePixelRatio || 1, pc = $('edPrev'); pc.width = 344 * dpr; pc.height = 230 * dpr; pc.style.width = '344px'; pc.style.height = '230px';
  buildForm();
  $('modal').classList.add('show');
  $('edCancel').onclick = closeEditor;
  $('edOk').onclick = () => {
    const c = ed.cfg; if (!c.name.trim()) c.name = randomName();
    if (ed.sp) { ed.sp.cfg = c; send({ t: 'cfg', id: ed.sp.id, cfg: c }); addLog(ed.sp, '✏ Contraintes modifiées : la population s\'adapte'); spTabFor = null; App.selSp = ed.sp; Tank.pendingReset = true; }
    else { App.selSp = createSpecies(c); toast(`🧬 <b>${esc(c.name)}</b> est née dans le labo. Elle évolue déjà !`); }
    closeEditor(); showTab('sp'); dirty.sp = true; renderSpeciesList();
  };
}
function closeEditor() { $('modal').classList.remove('show'); ed = null; }
function buildForm() {
  const c = ed.cfg, f = $('edForm');
  let h = `<h2>${ed.sp ? '✏ Modifier ' + esc(ed.sp.cfg.name) : '🧪 Créer une nouvelle espèce'}</h2>
    <div class="intro">Fixe les règles du jeu. L'évolution fera le reste : des centaines de copies sont testées à chaque génération, les meilleures se reproduisent avec des mutations.</div>
    <div class="h" style="margin-bottom:6px">Modèles de départ</div><div class="presets">${Object.keys(PRESETS).map(k => `<button data-pre="${k}">${k}</button>`).join('')}</div>`;
  for (const [title, fields] of FIELDS) {
    h += `<div class="sec"><div class="h">${title}</div>`;
    for (const fd of fields) {
      if (fd.t === 'text') h += `<div class="field"><label>${fd.l}</label><input type="text" data-p="${fd.p}" value="${esc(getP(c, fd.p))}" style="grid-column:2/4"></div>`;
      if (fd.t === 'range') h += `<div class="field"><label>${fd.l}</label><input type="range" data-p="${fd.p}" min="${fd.min}" max="${fd.max}" step="${fd.step}" value="${getP(c, fd.p)}"><span class="val" data-v="${fd.p}"></span></div>`;
      if (fd.t === 'range2') h += `<div class="field"><label>${fd.l}</label><div class="two"><input type="range" data-p="${fd.p[0]}" data-pair="${fd.p[1]}" data-lo="1" min="${fd.min}" max="${fd.max}" step="${fd.step}" value="${getP(c, fd.p[0])}"><input type="range" data-p="${fd.p[1]}" data-pair="${fd.p[0]}" min="${fd.min}" max="${fd.max}" step="${fd.step}" value="${getP(c, fd.p[1])}"></div><span class="val" data-v2="${fd.p.join(',')}"></span></div>`;
      if (fd.t === 'select') h += `<div class="field"><label>${fd.l}</label><select data-p="${fd.p}" style="grid-column:2/4">${Object.entries(fd.o).map(([k, v]) => `<option value="${k}" ${getP(c, fd.p) === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
      if (fd.t === 'check') h += `<div class="checks" style="grid-template-columns:1fr;margin-bottom:8px"><label><input type="checkbox" data-p="${fd.p}" ${getP(c, fd.p) ? 'checked' : ''}> ${fd.l}</label></div>`;
      if (fd.t === 'layers') {
        h += `<div class="field"><label>Nombre de couches cachées</label><select id="edNL" style="grid-column:2/4">${[1, 2, 3].map(n => `<option ${c.brain.layers.length === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>`;
        c.brain.layers.forEach((v, i) => { h += `<div class="field"><label>Neurones max · couche ${i + 1}</label><input type="range" data-layer="${i}" min="2" max="32" step="1" value="${v}"><span class="val">${v}</span></div>`; });
      }
      if (fd.t === 'sensors') h += `<div style="margin:6px 0 4px;font-size:12px;color:#c9cede">Sens disponibles (entrées du cerveau)</div><div class="checks">${SENSOR_DEFS.map(d => `<label><input type="checkbox" data-sensor="${d.k}" ${c.brain.sensors[d.k] ? 'checked' : ''}> ${d.name}</label>`).join('')}</div>`;
    }
    h += '</div>';
  }
  f.innerHTML = h;
  f.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { applyPreset(c, PRESETS[b.dataset.pre]); buildForm(); });
  f.querySelectorAll('input[data-p], select[data-p]').forEach(el => {
    const ev = el.type === 'range' ? 'input' : 'change';
    el.addEventListener(ev, () => {
      let v = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
      setP(c, el.dataset.p, v);
      if (el.dataset.pair) { // garder min ≤ max
        const other = getP(c, el.dataset.pair);
        if (el.dataset.lo && v > other) { setP(c, el.dataset.pair, v); f.querySelector(`[data-p="${el.dataset.pair}"]`).value = v; }
        if (!el.dataset.lo && v < other) { setP(c, el.dataset.pair, v); f.querySelector(`[data-p="${el.dataset.pair}"]`).value = v; }
      }
      c.body.segStart = clamp(c.body.segStart, c.body.segMin, c.body.segMax);
      const ss = f.querySelector('[data-p="body.segStart"]'); if (ss) ss.value = c.body.segStart;
      refreshVals(); ed.prevSim = null;
    });
  });
  f.querySelectorAll('[data-layer]').forEach(el => el.oninput = () => { c.brain.layers[+el.dataset.layer] = +el.value; el.nextElementSibling.textContent = el.value; ed.prevSim = null; refreshVals(); });
  $('edNL').onchange = e => { const n = +e.target.value; while (c.brain.layers.length < n) c.brain.layers.push(8); c.brain.layers.length = n; buildForm(); };
  f.querySelectorAll('[data-sensor]').forEach(el => el.onchange = () => { c.brain.sensors[el.dataset.sensor] = el.checked; refreshVals(); });
  refreshVals(); ed.prevSim = null;
}
function refreshVals() {
  const c = ed.cfg, f = $('edForm');
  for (const [, fields] of FIELDS) for (const fd of fields) {
    if (fd.t === 'range') { const el = f.querySelector(`[data-v="${fd.p}"]`); const v = getP(c, fd.p); if (el) el.innerHTML = fd.f ? fd.f(v) : (+v).toString(); }
    if (fd.t === 'range2') { const el = f.querySelector(`[data-v2="${fd.p.join(',')}"]`); if (el) el.textContent = `${getP(c, fd.p[0])} – ${getP(c, fd.p[1])}`; }
  }
  const nS = Object.values(c.brain.sensors).filter(Boolean).length;
  $('edInfo').innerHTML = `🧠 <b>${synapseCount(c)}</b> synapses · ${c.brain.layers.join(' → ')} neurones · ${nS} sens<br>
    🦴 ${c.body.segMin}–${c.body.segMax} vertèbres (départ ${c.body.segStart})<br>
    📏 Taille : ${Math.round(c.body.segMin * c.body.lenMin)} à ${Math.round(c.body.segMax * c.body.lenMax)} px<br>
    🧬 ${c.evo.pop} copies × ${c.evo.trials} essai(s) par génération<br>
    🎯 ${GOALS[c.goal.type]}` + (!c.brain.sensors.target && ['hunt'].includes(c.goal.type) ? '<br><span style="color:#eb6263">⚠ Sans « direction de la cible », elle ne pourra pas trouver les crevettes !</span>' : '') +
    (!c.brain.sensors.rhythm && !c.brain.recurrent ? '<br><span style="color:#d28e05">⚠ Sans rythme ni mémoire, onduler sera très difficile à inventer.</span>' : '');
}
function renderEditorPreview(t) {
  if (!ed) return;
  const c = ed.cfg;
  if (!ed.prevSim) {
    const b = c.body, g = randGenome(c);
    g.nSeg = b.segStart; g.segLen = (b.lenMin + b.lenMax) / 2; g.headW = (b.widthMin + b.widthMax) / 2; g.taper = (b.taperMin + b.taperMax) / 2;
    g.fin = b.finMax * 0.6; g.pect = b.pectMax * 0.6; g.flex = b.flexMax * 0.8; g.str = b.strMax; g.freq = b.freqMax; g.hue = c.hue;
    const s = new Sim(clampGenome(g, c), c, 0, 0, 0); s.manual = (j, tt) => Math.sin(tt * 0.12 - j * 0.75);
    ed.prevSim = s;
  }
  const s = ed.prevSim; s.g.hue = c.hue;
  s.step(0, 0, 1, 1); s.step(0, 0, 1, 1);
  const el = $('edPrev'), c2 = el.getContext('2d'), dpr = window.devicePixelRatio || 1, W = 344, H = 230;
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = c2.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#13527e'); gr.addColorStop(1, '#061a33'); c2.fillStyle = gr; c2.fillRect(0, 0, W, H);
  const size = s.n * s.L + 40, z = clamp((W - 40) / size, 0.4, 2.2);
  c2.setTransform(dpr * z, 0, 0, dpr * z, dpr * (W / 2 - s.x * z), dpr * (H / 2 - s.y * z));
  c2.strokeStyle = 'rgba(255,255,255,.06)'; c2.lineWidth = 1 / z;
  const x0 = s.x - W / 2 / z, y0 = s.y - H / 2 / z;
  for (let x = Math.floor(x0 / 40) * 40; x < x0 + W / z; x += 40) { c2.beginPath(); c2.moveTo(x, y0); c2.lineTo(x, y0 + H / z); c2.stroke(); }
  for (let y = Math.floor(y0 / 40) * 40; y < y0 + H / z; y += 40) { c2.beginPath(); c2.moveTo(x0, y); c2.lineTo(x0 + W / z, y); c2.stroke(); }
  drawCreature(c2, s, { pattern: c.pattern, muscles: App.ov.muscles, xray: App.ov.xray, z });
}

// =====================================================================
//  SAUVEGARDE (IndexedDB : tout reste dans ton navigateur)
// =====================================================================
const DB = 'abysse-labo', STORE = 'kv';
function idb() { return new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readonly'); const r = tx.objectStore(STORE).get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
let saving = false;
async function saveAll() {
  if (saving) return; saving = true;
  try {
    const snap = await request({ t: 'snapshot' });
    if (snap) for (const s of snap) { const sp = spById(s.id); if (sp) { sp.seeds = s.seeds; sp.gen = Math.max(sp.gen, s.gen); sp.evals = s.evals; } }
    const data = {
      v: 2, cam: App.ocean.cam, settings: App.ocean.settings, ov: App.ov,
      species: App.species.map(sp => ({ id: sp.id, cfg: sp.cfg, gen: sp.gen, evals: sp.evals, running: sp.running, history: sp.history, champs: sp.champs, log: sp.log, record: sp.record, lastVert: sp.lastVert, lastNeur: sp.lastNeur, seeds: sp.seeds })),
      creatures: App.ocean.creatures.slice(0, 500).map(c => ({ sp: c.sp.id, spec: c.specId, g: c.sim.g, x: c.sim.x, y: c.sim.y, energy: c.energy, ogen: c.ogen, eaten: c.eaten, kills: c.kills, labGen: c.labGen, sterile: c.sterile, immortal: c.immortal, name: c.name })),
      specimens: App.specimens.map(s => ({ ...s, ghost: undefined })),
    };
    await idbSet('state', data);
    $('saveState').textContent = '💾 Sauvegardé à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { $('saveState').textContent = '⚠ Sauvegarde impossible : ' + e.message; }
  saving = false;
}
$('saveBtn').onclick = saveAll;
setInterval(saveAll, 30000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });

async function boot() {
  let data = null;
  try { data = await idbGet('state'); } catch (e) {}
  if (data && data.species && data.species.length) {
    Object.assign(App.settings, data.settings || {}); Object.assign(App.ov, data.ov || {}); if (data.cam) Object.assign(App.cam, data.cam);
    for (const s of data.species) createSpecies(Object.assign(defaultCfg(), s.cfg), s);
    App.specimens = (data.specimens || []).map(s => { s.cfg = Object.assign(defaultCfg(), s.cfg); s.g = clampGenome(s.g, s.cfg); return s; });
    for (const c of data.creatures || []) {
      const spec = c.spec && App.specimens.find(s => s.id === c.spec), sp = spec ? specSpecies(spec) : spById(c.sp);
      if (sp) spawnCreature(clampGenome(c.g, sp.cfg), sp, c.x, c.y, { ...c, specId: c.spec }, App.ocean);
    }
    App.selSp = App.species[0];
    const total = App.species.reduce((a, s) => a + s.evals, 0);
    toast(`👋 Bon retour au labo ! ${App.species.length} espèces, ${fmt(total)} copies déjà testées, ${App.creatures.length} créatures dans l'océan.`);
    $('saveState').textContent = '💾 Espèces restaurées';
  } else {
    const a = applyPreset(defaultCfg(), PRESETS['🐟 Poisson']); a.name = 'Piscis primordia'; a.hue = 195; a.goal.type = 'survive'; a.brain.sensors.danger = true;
    const b = Object.assign(defaultCfg(), { name: 'Anguilla abyssi', hue: 130 }); b.body = structuredClone(PRESETS['🐍 Anguille'].body); b.pattern = 'gradient';
    b.brain.layers = [10, 8]; b.brain.sensors.proprio = true;
    const d = applyPreset(defaultCfg(), PRESETS['🦈 Squale-faucheur']);
    createSpecies(a); createSpecies(b); createSpecies(d);
    App.selSp = App.species[0];
    toast('🧪 Trois espèces primitives évoluent dans le labo (à gauche), dont un prédateur 🦈.<br>Quand leur score monte, clique 🌊 pour les lâcher dans l\'océan, ou ⚔ Arène pour un duel !');
  }
  OVS.forEach(([k], i) => $('ovGrp').querySelectorAll('button')[i].classList.toggle('on', App.ov[k]));
  for (let i = 0; i < App.settings.foodTarget * 0.8; i++) spawnFood();
  dirty.list = dirty.sp = dirty.ind = true; Tank.pendingReset = true;
}

// =====================================================================
//  BOUCLE PRINCIPALE
// =====================================================================
let spTabFor = null;
let frameN = 0, lastUI = 0, fps = 60, lastT = performance.now();
function frame(t) {
  frameN++; fps = fps * 0.95 + 50 / Math.max(1, t - lastT); lastT = t;
  rebuildGrid(App.world);
  const ts = App.timeScale;
  if (ts > 0) {
    const dt = Math.min(1, ts), steps = Math.max(1, Math.round(ts));
    for (let k = 0; k < steps; k++) { worldStep(App.world, dt); tankStep(dt); }
  }
  if (fallback) fallback.tick(7);
  if (App.follow && App.selCr && App.selCr.sim && !App.selCr.tank) { App.cam.x += (App.selCr.sim.x - App.cam.x) * 0.1; App.cam.y += (App.selCr.sim.y - App.cam.y) * 0.1; }
  renderOcean(t);
  if (frameN % 3 === 0) renderMinimap();
  if (Tank.pendingReset) tankReset();
  if (App.tab === 'sp') renderTank(t);
  if (dirty.list) { dirty.list = false; renderSpeciesList(); }
  if (dirty.sp) { dirty.sp = false; if (!spCharts || spTabFor !== App.selSp) { buildSpeciesTab(); spTabFor = App.selSp; } else updateSpeciesTab(); }
  if (dirty.ind || indBuiltFor !== App.selCr) { dirty.ind = false; buildIndTab(); }
  if (App.tab === 'ind' && frameN % 2 === 0) { drawBrain(); drawMuscles(); drawPower(); }
  if (ed) renderEditorPreview(t);
  if (t - lastUI > 250) {
    lastUI = t; updateCardBars(); updateIndTab(); renderDuelHud();
    $('hud').style.display = App.view === 'arena' ? 'none' : '';
    for (const sp of App.species) { // extinctions dans l'océan
      const n = App.ocean.creatures.filter(c => c.sp === sp).length;
      if (sp.oceanN > 0 && n === 0) { toast(`💀 Extinction : <b>${esc(sp.cfg.name)}</b> a disparu de l'océan.`); addLog(sp, '💀 Extinction de la population sauvage dans l\'océan'); }
      if (sp.oceanN > 0 && n >= sp.oceanPeak * 2 && n >= 50) { addLog(sp, `📈 Explosion démographique dans l'océan : ${n} individus`); sp.oceanPeak = n; }
      if (!sp.oceanPeak || n > sp.oceanPeak * 2) sp.oceanPeak = Math.max(sp.oceanPeak || 0, n);
      sp.oceanN = n;
    }
    const counts = App.species.map(sp => `<span style="color:hsl(${sp.cfg.hue},70%,70%)">●</span> ${App.creatures.filter(c => c.sp === sp).length}`).join(' ');
    $('hud').innerHTML = `🌊 <b>${App.creatures.length}</b> créatures · 🦐 ${App.food.length} · zoom ${App.cam.z.toFixed(2)}× · ${App.timeScale ? App.timeScale + '×' : 'pause'}<br>${counts}<br><span style="color:#8a90a6">naissances ${App.births} · morts ${App.deaths} · ${Math.round(fps)} img/s</span>`;
    $('labSpeed').textContent = App.species.filter(s => s.running).length + ' en évolution';
    if ($('omPops')) $('omPops').innerHTML = App.species.map(sp => `<div class="kv"><span><span style="color:hsl(${sp.cfg.hue},70%,62%)">●</span> ${esc(sp.cfg.name)}</span><b>${App.ocean.creatures.filter(c => c.sp === sp).length}</b></div>`).join('');
  }
  requestAnimationFrame(frame);
}
resize();
boot().then(() => requestAnimationFrame(frame));
window.__app = App;

</script>
